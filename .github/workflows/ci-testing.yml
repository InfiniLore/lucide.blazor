name: Dotnet Testing

on:
    workflow_dispatch:
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
        branches: [ core ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: src/CodeOfChaos.BlazorIcons.Lucide/package-lock.json

            -   name: Install Dependencies
                run: npm install
                working-directory: ${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Export node_modules path
                run: |
                    echo "NODE_PATH=${{ github.workspace }}/node_modules" >> $GITHUB_ENV
                    export NODE_PATH=${{ github.workspace }}/node_modules

            -   name: Restore NuGet packages
                run: dotnet restore InfiniLore.IconLibs.slnx

            -   name: Build projects
                run: dotnet build --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution InfiniLore.IconLibs.slnx --configuration Release --no-restore --no-build
