name: "CI: Release"

on:
    workflow_dispatch:
        inputs:
            part:
                description: "Version part to bump"
                required: false
                default: none
                type: choice
                options:
                    - none
                    - major
                    - minor
                    - patch
                    - preview
            custom_version:
                description: "Explicit version override (example: 1.14.1 or 1.14.1-preview.1)"
                required: false
                type: string
            publish_to_nuget:
                description: "Publish packages to NuGet.org and GitHub Packages"
                required: false
                default: true
                type: boolean

permissions:
    contents: write
    packages: write

jobs:
    testing:
        # noinspection UndefinedAction
        uses: ./.github/workflows/shared-testing.yml
        secrets: inherit

    publish:
        runs-on: ubuntu-latest
        needs: testing
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6
                with:
                    token: ${{ secrets.CI_RELEASE_TOKEN }}

            -   name: Setup Python
                uses: actions/setup-python@v7
                with:
                    python-version: "3.14"

            -   name: Configure Git
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            -   name: Run version bump script (commit directly)
                run: |
                    CMD=(python scripts/bump_version.py
                      --repo-root .
                      --csproj src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj
                      --csproj src/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators.csproj
                      --update-package-json
                    )

                    if [ -n "${{ inputs.custom_version }}" ]; then
                      CMD+=(--custom-version "${{ inputs.custom_version }}")
                    elif [ -n "${{ inputs.part }}" ] && [ "${{ inputs.part }}" != "none" ]; then
                      CMD+=(--part "${{ inputs.part }}")
                    else
                      LUCIDE_VERSION="$(python -c 'import json, pathlib; pkg=json.loads(pathlib.Path("src/CodeOfChaos.BlazorIcons.Lucide/package.json").read_text(encoding="utf-8")); print(pkg["dependencies"]["lucide-static"])')"
                      echo "No inputs provided. Using lucide-static version: $LUCIDE_VERSION"
                      CMD+=(--custom-version "$LUCIDE_VERSION")
                    fi

                    "${CMD[@]}"

                    if [ -n "$(git status --porcelain)" ]; then
                      NEW_VERSION="$(python -c 'import xml.etree.ElementTree as ET; tree=ET.parse("src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj"); print(tree.getroot().find(".//Version").text.strip())')"
                      git add .
                      git commit -m "chore: bump release version to ${NEW_VERSION}"
                      git push
                    else
                      echo "No version changes to commit."
                    fi

            -   name: Resolve release version and tag
                run: |
                    VERSION="$(python -c 'import xml.etree.ElementTree as ET; tree=ET.parse("src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj"); print(tree.getroot().find(".//Version").text.strip())')"
                    echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                    echo "TAG=v$VERSION" >> "$GITHUB_ENV"

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: src/CodeOfChaos.BlazorIcons.Lucide/package-lock.json

            -   name: Install dependencies
                run: npm install
                working-directory: ${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Export node_modules path
                run: |
                    echo "NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules" >> $GITHUB_ENV
                    export NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules

            -   name: Restore NuGet packages
                run: dotnet restore CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf

            -   name: Build projects
                run: dotnet build CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf --configuration Release --no-restore

            -   name: Pack
                run: dotnet pack CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf --configuration Release -o ./release

            -   name: Upload NuGet Artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: nuget-packages-${{ env.TAG }}
                    path: ./release/*.nupkg

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    token: ${{ secrets.CI_RELEASE_TOKEN }}
                    tag_name: ${{ env.TAG }}
                    name: Release ${{ env.VERSION }}
                    generate_release_notes: true
                    files: ./release/*.nupkg
                    prerelease: ${{ contains(env.VERSION, 'preview') }}

            -   name: Push to NuGet
                if: ${{ inputs.publish_to_nuget }}
                env:
                    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$NUGET_API_KEY" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate

            -   name: Push GitHub Packages
                if: ${{ inputs.publish_to_nuget }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "${{ secrets.GITHUB_TOKEN }}" \
                      --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                      --skip-duplicate
