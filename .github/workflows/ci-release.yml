name: "CI: Release"

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*.*.*' # Match version tags like v1.0.0

jobs:
    testing:
        # noinspection UndefinedAction
        uses: ./.github/workflows/shared-testing.yml
        secrets: inherit
        
    publish:
        runs-on: ubuntu-latest
        needs: testing
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5

            -   name: Setup Python
                uses: actions/setup-python@v6

            -   name: Setup Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.12"

            -   name: Validate inputs
                run: |
                    if [ -z "${{ inputs.custom_version }}" ] && [ -z "${{ inputs.part }}" ]; then
                      echo "Provide either custom_version or part."
                      exit 1
                    fi

            -   name: Run version bump script
                run: |
                    CMD=(python scripts/bump_version.py
                      --repo-root .
                      --csproj src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj
                      --csproj src/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators.csproj
                      --update-package-json
                    )
                    
                    if [ -n "${{ inputs.custom_version }}" ]; then
                      CMD+=(--custom-version "${{ inputs.custom_version }}")
                    else
                      CMD+=(--part "${{ inputs.part }}")
                    fi
                    
                    "${CMD[@]}"

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Export node_modules path
                run: |
                    echo "NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules" >> $GITHUB_ENV
                    export NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules

            -   name: Restore NuGet packages
                run: dotnet restore CodeOfChaos.BlazorIcons.slnx

            -   name: Build projects
                run: dotnet build --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution CodeOfChaos.BlazorIcons.slnx --configuration Release --no-restore --no-build
        
            -   name: Install Dependencies
                run: npm install
                working-directory: ${{ github.workspace }}

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        9.x
                        10.x

            -   name: Export node_modules path
                run: |
                    echo "NODE_PATH=${{ github.workspace }}/node_modules" >> $GITHUB_ENV
                    export NODE_PATH=${{ github.workspace }}/node_modules

            -   name: Restore NuGet packages
                run: dotnet restore InfiniLore.IconLibs.slnx

            -   name: Build projects
                run: dotnet build --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution InfiniLore.IconLibs.slnx --configuration Release --no-restore --no-build

            -   name: Publish to NuGet
                env:
                    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                run: |
                    dotnet nuget push src/CodeOfChaos.BlazorIcons.Lucide/bin/Release/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
                    dotnet nuget push src/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators/bin/Release/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate