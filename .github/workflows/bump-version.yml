name: Bump Version

on:
  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump (ignored when custom_version is set)
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - preview
      custom_version:
        description: Explicit version (for example 1.15.0 or 1.15.0-preview.1)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.custom_version }}" ] && [ -z "${{ inputs.part }}" ]; then
            echo "Provide either custom_version or part."
            exit 1
          fi

      - name: Run version bump script
        run: |
          CMD=(python scripts/bump_version.py
            --repo-root .
            --csproj src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj
            --csproj src/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators.csproj
            --update-package-json
          )

          if [ -n "${{ inputs.custom_version }}" ]; then
            CMD+=(--custom-version "${{ inputs.custom_version }}")
          else
            CMD+=(--part "${{ inputs.part }}")
          fi

          "${CMD[@]}"

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: bump package version"
          branch: "chore/bump-version-${{ github.run_id }}"
          delete-branch: true
          title: "chore: bump package version"
          body: |
            Automated version bump.

            Updated:
            - `src/CodeOfChaos.BlazorIcons.Lucide/CodeOfChaos.BlazorIcons.Lucide.csproj`
            - `src/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators/CodeOfChaos.BlazorIcons.Lucide.SourceGenerators.csproj`
            - `src/CodeOfChaos.BlazorIcons.Lucide/package.json`

      - name: No changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No file changes detected."
